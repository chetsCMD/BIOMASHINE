name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
            artifact: windows
          - name: Linux
            os: ubuntu-latest
            args: --linux
            artifact: linux
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --mac --arm64
            artifact: macos-arm64
          - name: macOS (Intel)
            os: macos-latest
            args: --mac --x64
            artifact: macos-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare assets
        run: node scripts/prepare.js

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BIOMASHINE-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  source-archive:
    name: Package source code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source zip
        run: |
          mkdir -p artifacts
          zip -r "artifacts/BIOMASHINE-source-${GITHUB_REF_NAME}.zip" . \
            -x "node_modules/*" "*/node_modules/*" \
               "dist/*" "*/dist/*" \
               ".git/*" "*/.git/*"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: BIOMASHINE-source
          path: artifacts/BIOMASHINE-source-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    name: Publish draft release
    needs: [build, source-archive]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
